<!doctype html>
<html><head><meta charset="utf-8">
<style>
  @font-face { font-family: 'Roboto Condensed'; font-weight: 700; src: url(../fonts/RobotoCondensed-700.woff2) format('woff2'); }
  html, body { margin: 0; background: transparent; }
  #cap {
    width: 1080px; height: 260px; display: flex; align-items: center; justify-content: center;
    font-family: 'Roboto Condensed', sans-serif; font-weight: 700; font-size: 104px; letter-spacing: -0.01em; color: #fff;
    -webkit-text-stroke: 7px #000; paint-order: stroke fill;
    text-shadow: 0 4px 14px rgba(0,0,0,0.25);
  }
  .emo { font-family: 'Noto Color Emoji'; -webkit-text-stroke: 0; margin-left: 22px; font-size: 92px; }
</style></head>
<body><div id="cap">Did Claude cook?<span class="emo">😮‍💨</span></div></body></html>
